global:
  namespace: dev-ns
  keyvaultName: "keyvaorg-dev"
  azureTenantId: ""
  userAssignedIdentityID: ""

auth:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

ai:
  replicaCount: 1
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

hr:
  replicaCount: 1
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }

finance:
  replicaCount: 1
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }

projects:
  replicaCount: 1
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }

gateway:
  replicaCount: 1
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }

frontend:
  replicaCount: 1
  image:
    name: maheshnandi/organistation-frontend
    tag: v1.0.0
    useAcrPullSecret: false
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }

notification:
  replicaCount: 1
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
