# Global values for OrganiStation
global:
  namespace: dev-ns
  imageTag: ""
  keyvaultName: "your-kv-name"
  azureTenantId: "your-tenant-id"
  userAssignedIdentityID: ""
  # 7-char git SHA from CI (e.g. a1b2c3d). Override via --set global.imageTag=<sha>
  imageTag: ""

auth:
  enabled: true
hr:
  enabled: true
ai:
  enabled: true
projects:
  enabled: true
finance:
  enabled: true
gateway:
  enabled: true
frontend:
  enabled: true
notification:
  enabled: true

ingress:
  enabled: true
  name: organistation-ingress
  sslRedirect: false
  port: 80
